# GCS_A 编队槽位配置（key=任务层 leader_id A01..A15，value 为 follower 相对 leader 的 ENU 偏移）
# 场景3 15机编队（对应 references/runtime examples/joint_mission/group_a 六批次任务包）：
#   - prepare / coverage-segment-1: A01 leader，A02..A12 followers（12机）
#   - fault-exit: A07..A12（8m 撤离，无编队）
#   - recovery / coverage-segment-2 / hold-end: A01 leader，A02..A06 + A13..A15(reserve) followers（9机）
#
# 槽位几何（相对 A01，5m 网格，与 plans.json 中 prepare 目标点网格一致）：
#   A02(-5,-5) A03(0,-5) A04(5,-5) A05(10,-5)
#   A06(-5,0)  A07(5,0)  A08(10,0)
#   A09(-5,5)  A10(0,5)  A11(5,5)  A12(10,5)
# reserve A13..A15 复用 A09..A11 槽位：A09..A12 在 fault-exit 批次后退出编队，
# 不会与 A13..A15 同时参与后续批次，因此同槽位不冲突。
formation_offsets:
  A01:
    A02: [-5.0, -5.0, 0.0]
    A03: [0.0, -5.0, 0.0]
    A04: [5.0, -5.0, 0.0]
    A05: [10.0, -5.0, 0.0]
    A06: [-5.0, 0.0, 0.0]
    A07: [5.0, 0.0, 0.0]
    A08: [10.0, 0.0, 0.0]
    A09: [-5.0, 5.0, 0.0]
    A10: [0.0, 5.0, 0.0]
    A11: [5.0, 5.0, 0.0]
    A12: [10.0, 5.0, 0.0]
    A13: [-5.0, 5.0, 0.0]
    A14: [0.0, 5.0, 0.0]
    A15: [5.0, 5.0, 0.0]