# A 组五机工程测试专用标定集合（A08 领机 + A10/A12/A13/A06 -> UAV8/UAV10/UAV12/UAV13/UAV6）
#
# 为什么单开这份：五机轮（2026-10-10 决定）在四机阵容基础上增加 A06（修复归队）。
# 四机配置 calibration_four_uav.yaml 的集合为 {UAV8,UAV10,UAV12,UAV13}，而 ready 是
# ALL 语义（gcs_a_calibration_node.py:113-117）——机数与集合必须精确一致，
# 故五机轮换一份五机集合。
#
# 必须写执行层 UAVn，不能写任务层 Axx：
# calibration.py:validate_calibration_config 依据 identity_file 校验每一项都是
# 存在的 exec_target，写成 Axx 会在节点启动时直接 ValueError。
#
# 采样窗口 8.0 s：原因与三机/四机配置完全相同（限频后 global 5 Hz，2.0 s 窗口在
# 「样本数 >=5 且跨度 >=0.95*窗口」下结构性够不着，2026-09-23 实测 0/100）。
# 五机为 5 路流并存，窗口理由不变；详见 config/calibration_four_uav.yaml 同名注释。

calibration_uavs: [UAV6, UAV8, UAV10, UAV12, UAV13]
all_uavs: [UAV6, UAV8, UAV10, UAV12, UAV13]
sample_window_s: 8.0
