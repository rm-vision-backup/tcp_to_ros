# Group A 任务层身份 -> 执行层身份映射
# 任务层身份: A01 ... A15
# 执行层身份: UAV1 ... UAV15 / hostname
#
# 注意: 本文件为待复核配置。正式实机使用前必须人工复核
#       exec_target / hostname / ip 与现场实际一致。
# 仿真(单机多 Master)时使用 127.0.0.1 + port_offset, 见 swarm_topology_bridge 配置。
# enabled 仅表示该身份可被任务解析和链路发现，不表示该机必须上电；
# 每条任务的参与集始终仅来自 assignments。

protocol_version: "1.0"
group_id: "GroupA"

uavs:
  - { uav_id: "A01", exec_target: "UAV1",  hostname: "UAV1",  ip: "192.168.5.11",  enabled: true }
  - { uav_id: "A02", exec_target: "UAV2",  hostname: "UAV2",  ip: "192.168.5.12",  enabled: true }
  - { uav_id: "A03", exec_target: "UAV3",  hostname: "UAV3",  ip: "192.168.5.13",  enabled: true }
