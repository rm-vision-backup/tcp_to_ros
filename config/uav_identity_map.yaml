  - { uav_id: "A06", exec_target: "UAV6",  hostname: "UAV6",  ip: "192.168.5.61",  enabled: true }
  - { uav_id: "A07", exec_target: "UAV7",  hostname: "UAV7",  ip: "192.168.5.71",  enabled: true }
  - { uav_id: "A08", exec_target: "UAV8",  hostname: "UAV8",  ip: "192.168.5.81",  enabled: true }
  - { uav_id: "A09", exec_target: "UAV9",  hostname: "UAV9",  ip: "192.168.5.91",  enabled: true }
  - { uav_id: "A10", exec_target: "UAV10", hostname: "UAV10", ip: "192.168.5.101", enabled: true }
  - { uav_id: "A11", exec_target: "UAV11", hostname: "UAV11", ip: "192.168.5.111", enabled: true }
