  - { uav_id: "A07", exec_target: "UAV7",  hostname: "UAV7",  ip: "192.168.5.17",  enabled: true }
  - { uav_id: "A08", exec_target: "UAV8",  hostname: "UAV8",  ip: "192.168.5.18",  enabled: true }
  - { uav_id: "A09", exec_target: "UAV9",  hostname: "UAV9",  ip: "192.168.5.19",  enabled: true }
