# TCP server（transport）参数 canonical 默认（implementation_plan_26082916 §7）。
# 加载方式：tcp_server_node 私有 namespace（tcp_to_ros_mock.launch rosparam load）。
# launch 可作 deployment override（host/port 等）。
# 语义（单位见注释）。

host: 0.0.0.0                         # 监听地址（str）：TCP server bind 地址
port: 39001                           # 监听端口（int，>0）：GCS 链路 TCP 端口
action_name: /group_a/execute_task    # Action 服务器名（str）：tcp_server 作为 action client 连接 backend
state_topic: /group_a/group_task_state  # 组任务状态话题（str）：把任务状态发布给 TCP 客户端
emergency_hold_service: /group_a/emergency_hold  # 紧急 HOLD service 名（str）：TCP 触发紧急 HOLD 的入口

